# Docker Compose for one-click local development of Vinci Clips
# NOTE: `version` key is deprecated in Compose v2, so it's removed to avoid the warning.

services:
  # === MongoDB database ===
  mongodb:
    image: mongo:7.0
    container_name: vinci-clips-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: vinci-clips
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - vinci-network

  # === Redis cache (future use) ===
  redis:
    image: redis:7-alpine
    container_name: vinci-clips-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vinci-network

  # === Backend API (Express) ===
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vinci-clips-backend
    restart: unless-stopped
    environment:
      # Server config
      PORT: 8080
      NODE_ENV: development

      # DB (points to mongodb service on the internal network)
      DB_URL: mongodb://admin:password123@mongodb:27017/vinci-clips?authSource=admin

      # Google Cloud (optional for local dev, put dummy values or mount your json)
      GCP_BUCKET_NAME: dummy-bucket
      GCP_SERVICE_ACCOUNT_PATH: /app/gcp-service-account.json
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    volumes:
      # Mount entire backend for hot reload in dev
      - ./backend:/app
      # Keep container's node_modules (avoid overwriting with an empty host dir)
      - /app/node_modules
      # Mount service account key if provided
      - ${GCP_SERVICE_ACCOUNT_PATH:-./backend/gcp-service-account.json}:/app/gcp-service-account.json:ro
    depends_on:
      - mongodb
      - redis
    networks:
      - vinci-network
    healthcheck:
      # Hit the /health endpoint to mark the service healthy
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  # === Frontend (Next.js) ===
  frontend:
    # Use the deps stage so we don't run a production build; we want npm run dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps             # remove if your Dockerfile has no "deps" stage
    container_name: vinci-clips-frontend
    restart: unless-stopped

    # Dev server (hot reload, no blocking lint/type errors)
    command: npm run dev

    environment:
      NODE_ENV: development
      # Use backend service name inside the docker network
      NEXT_PUBLIC_API_URL: http://backend:8080

    ports:
      - "3000:3000"            # change host port if 3000 is in use

    volumes:
      # RW mounts for hot reload (remove :ro)
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules      # preserve container deps

    depends_on:
      backend:
        condition: service_healthy   # wait until backend passes healthcheck
    networks:
      - vinci-network

# === Networks & Volumes ===
networks:
  vinci-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
